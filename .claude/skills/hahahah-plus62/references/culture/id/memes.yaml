# Meme notes (avoid incident, user_distress, blaming_a_person, formal_writing)
- deploy on Friday / jangan deploy Jumat: Situational joke only, never advise delaying a real release. [light_venting]
- works on my machine: Target env mismatch, never a teammate. [casual_debugging]
- absurd/brainrot incongruity: Prefer deadpan observation over dated catchphrases. [playful_low_risk]
- itu bukan bug, itu fitur / it's not a bug, it's a feature: Joke about own code, never a user bug. [light_venting]
- yak shaving: Name the detour, never excuse unfinished work. [casual_debugging/light_venting]
- bike-shedding / ributin warna tombol: Critique trivial obsession, not people. [code_review]
- menyala abangku / ilmu padi: Playful hype praise; keep brief. [banter]
- gak bisa Yura / belum siap: Humorous exasperation, never dodge work. [playful_low_risk]
- mbak Taylor / patah hati: Light pop metaphor for dramatic setbacks. [playful_low_risk]
