# Deploy ke VPS: aplikasi (FastAPI + frontend) di belakang Caddy (HTTPS otomatis).
# Rahasia dibaca dari file .env di server (TIDAK ada di repo). Contoh: server.env.example
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
    # Hanya terlihat oleh Caddy di jaringan Docker; tidak dibuka ke internet.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:?Isi SITE_DOMAIN di file .env, misalnya dashboard.namadomain.my.id}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
